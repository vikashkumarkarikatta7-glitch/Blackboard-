name: Build Android APK (<10MB)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Compact Release APK (<10MB)
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/release/*.apk dist-apk/SmartDigitalBlackboard.apk
          ls -lh dist-apk/SmartDigitalBlackboard.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartDigitalBlackboard-APK
          path: dist-apk/SmartDigitalBlackboard.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Smart Digital Blackboard v1.0.${{ github.run_number }}
          files: dist-apk/SmartDigitalBlackboard.apk
